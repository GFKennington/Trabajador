name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Run CI gates (biome, cspell, links, secrets, typecheck, build)
        run: mise run ci
